services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dojang
      POSTGRES_PASSWORD: dojang
      POSTGRES_DB: dojang
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dojang"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
