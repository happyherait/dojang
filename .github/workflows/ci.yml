name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 26]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dojang
          POSTGRES_PASSWORD: dojang
          POSTGRES_DB: dojang_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dojang"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://dojang:dojang@localhost:5432/dojang_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web
